<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlyDrone · actividad PFL3 3D</title>
<style>
  :root { color-scheme: dark; --bg:#080b12; --panel:#111725; --text:#ecf2ff; --muted:#99a8c1; --line:#29344a; --accent:#67d5ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,sans-serif; }
  main { max-width:1200px; margin:auto; padding:18px; }
  h1 { margin:0 0 4px; font-size:21px; font-weight:600; }
  .sub { color:var(--muted); margin-bottom:14px; }
  .stage { position:relative; border:1px solid var(--line); background:radial-gradient(circle at 50% 40%,#182237,#080b12 72%); border-radius:12px; overflow:hidden; }
  canvas { width:100%; height:600px; display:block; cursor:grab; touch-action:none; }
  canvas:active { cursor:grabbing; }
  .hint { position:absolute; left:12px; bottom:10px; color:var(--muted); pointer-events:none; }
  .controls { display:grid; grid-template-columns:auto 1fr auto; gap:10px 14px; align-items:center; margin-top:14px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  button,select { color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:8px 13px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  output { min-width:62px; text-align:right; font-variant-numeric:tabular-nums; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:10px 12px; min-width:0; }
  .stat span { display:block; color:var(--muted); font-size:12px; }
  .stat strong { display:block; margin-top:3px; font-size:17px; font-weight:500; overflow:hidden; text-overflow:ellipsis; }
  .legend { display:flex; align-items:center; gap:9px; color:var(--muted); margin-top:10px; }
  .ramp { width:150px; height:8px; border-radius:4px; background:linear-gradient(90deg,hsl(215 75% 45%),hsl(55 95% 55%),hsl(5 90% 55%)); }
  @media(max-width:650px){ canvas{height:430px}.stats{grid-template-columns:1fr 1fr}.controls{grid-template-columns:auto 1fr auto} }
</style>
</head>
<body>
<main>
  <h1>Actividad PFL3 sobre esqueletos FlyWire</h1>
  <div class="sub">24 neuronas FAFB 783 · modelo estacionario publicado · la señal R−L todavía no controla un dron</div>
  <div class="stage">
    <canvas id="scene" aria-label="Visualización tridimensional rotatoria de 24 esqueletos PFL3 coloreados por tasa"></canvas>
    <div class="hint">Arrastrá para rotar · rueda para acercar</div>
  </div>
  <div class="controls">
    <label for="mode">Modelo</label><select id="mode"><option value="weighted">FlyWire ponderado</option><option value="reference">Referencia publicada</option></select><output></output>
    <label for="heading">Heading</label><input id="heading" type="range" min="-180" max="180" value="0" step="1"><output id="headingValue">0°</output>
    <label for="goal">Objetivo</label><input id="goal" type="range" min="-180" max="180" value="0" step="1"><output id="goalValue">0°</output>
    <button id="play" type="button" aria-pressed="false">Reproducir giro</button><div></div><button id="reset" type="button">Centrar vista</button>
  </div>
  <div class="stats" aria-live="polite">
    <div class="stat"><span>LAL izquierdo</span><strong id="leftRate">—</strong></div>
    <div class="stat"><span>LAL derecho</span><strong id="rightRate">—</strong></div>
    <div class="stat"><span>Señal R−L</span><strong id="readout">—</strong></div>
    <div class="stat"><span>Mayor actividad</span><strong id="hottest">—</strong></div>
  </div>
  <div class="legend"><span>Baja</span><div class="ramp"></div><span>Alta actividad relativa</span></div>
</main>
<script>
const neurons=__GEOMETRY_JSON__;
const model=__MODEL_JSON__;
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
const heading=document.getElementById('heading'),goal=document.getElementById('goal'),mode=document.getElementById('mode');
let yaw=-0.55,pitch=0.35,zoom=1.15,drag=false,lastX=0,lastY=0,playing=false,lastTime=0;
let dirty=true, projected=[];
function radians(v){return v*Math.PI/180}
function softplus(z){return z>30?z:Math.log1p(Math.exp(z))}
function rates(){
  const h=radians(+heading.value),g=radians(+goal.value);
  if(mode.value==='weighted'){
    const dact=model.connectome.deltaAnglesDeg.map(v=>Math.cos(h-radians(v)));
    const fact=model.connectome.fc2AnglesDeg.map(v=>Math.cos(g-radians(v)));
    return model.connectome.deltaWeights.map((dw,i)=>{
      const headingDrive=dw.reduce((sum,w,j)=>sum+w*dact[j],0);
      const goalDrive=model.connectome.fc2Weights[i].reduce((sum,w,j)=>sum+w*fact[j],0);
      return model.a*softplus(model.b*(headingDrive+model.d*goalDrive+model.c));
    });
  }
  return model.headingPreferredDeg.map((hp,i)=>model.a*softplus(model.b*(Math.cos(h-radians(hp))+model.d*Math.cos(g-radians(model.goalPreferredDeg[i]))+model.c)));
}
function color(rate,min,max){const t=max===min?0.5:(rate-min)/(max-min);const hue=215-210*t;return `hsla(${hue},90%,${45+10*t}%,${0.2+0.8*t})`}
function resize(){const dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);dirty=true;}
function rebuildProjection(){
  const w=canvas.clientWidth,h=canvas.clientHeight,scale=Math.min(w,h)*0.0048*zoom;
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  projected=neurons.map(n=>{const p=n.points,out=new Float32Array(p.length/3*3);let zsum=0;
    for(let i=0,j=0;i<p.length;i+=3,j+=3){const x=p[i],y=p[i+1],z=p[i+2];const x1=cy*x-sy*z,z1=sy*x+cy*z,y1=cp*y-sp*z1,z2=sp*y+cp*z1;const perspective=1/(1+z2/420);out[j]=w/2+x1*scale*perspective;out[j+1]=h/2-y1*scale*perspective;out[j+2]=z2;zsum+=z2;}
    return {p:out,e:n.edges,depth:zsum/(p.length/3),n};});
  projected.sort((a,b)=>a.depth-b.depth);dirty=false;
}
function draw(){
  if(dirty)rebuildProjection();const rs=rates(),lo=Math.min(...rs),hi=Math.max(...rs);ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);ctx.lineCap='round';
  for(const item of projected){const idx=neurons.indexOf(item.n),p=item.p,e=item.e;ctx.beginPath();for(let j=0;j<e.length;j+=2){const a=e[j]*3,b=e[j+1]*3;ctx.moveTo(p[a],p[a+1]);ctx.lineTo(p[b],p[b+1]);}ctx.strokeStyle=color(rs[idx],lo,hi);ctx.lineWidth=0.55+2.1*(rs[idx]-lo)/(hi-lo||1);ctx.stroke();}
  let l=0,r=0,maxI=0;rs.forEach((v,i)=>{if(model.sides[i]==='left')l+=v;else r+=v;if(v>rs[maxI])maxI=i;});
  document.getElementById('leftRate').textContent=l.toFixed(1)+' Hz';document.getElementById('rightRate').textContent=r.toFixed(1)+' Hz';document.getElementById('readout').textContent=(r-l).toFixed(1)+' Hz';document.getElementById('hottest').textContent=neurons[maxI].column+' · '+neurons[maxI].side;
  document.getElementById('headingValue').textContent=heading.value+'°';document.getElementById('goalValue').textContent=goal.value+'°';
}
function frame(t){if(playing&&t-lastTime>35){let v=+heading.value+2;if(v>180)v=-180;heading.value=v;lastTime=t;draw();}requestAnimationFrame(frame)}
[heading,goal].forEach(el=>el.addEventListener('input',draw));mode.addEventListener('change',draw);
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.008;pitch=Math.max(-1.45,Math.min(1.45,pitch+(e.clientY-lastY)*.008));lastX=e.clientX;lastY=e.clientY;dirty=true;draw()});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.35,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));dirty=true;draw()},{passive:false});
document.getElementById('play').addEventListener('click',e=>{playing=!playing;e.currentTarget.textContent=playing?'Pausar':'Reproducir giro';e.currentTarget.setAttribute('aria-pressed',String(playing))});
document.getElementById('reset').addEventListener('click',()=>{yaw=-.55;pitch=.35;zoom=1.15;dirty=true;draw()});
new ResizeObserver(()=>{resize();draw()}).observe(canvas);resize();draw();requestAnimationFrame(frame);
</script>
</body>
</html>
