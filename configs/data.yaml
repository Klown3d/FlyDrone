# Exact labels in FAFB 783 annotation release v2.1.0, hemibrain_type column.
# These are annotations of FlyWire cells, not imported hemibrain neurons/edges.
dataset: FAFB
materialization_version: 783
annotation_commit: ebd66db2596fcc39c6950fb54ea3efa00f7fe8a0
type_column: hemibrain_type
types:
  EPG: EPG
  Delta7: Delta7
  FC2A: FC2
  FC2B: FC2
  FC2C: FC2
  PFL3: PFL3
excluded_related_types:
  EPGt: Distinct annotation; not automatically equated with EPG.
minimum_pair_synapses: 1
sensitivity_thresholds: [1, 3, 5, 10]
# Preserve every neuropil and every within-set edge; report one-hop boundary.
neuropil_filter: null
boundary_hops: 1
output_dir: data/processed/fafb783_epg_delta7_fc2_pfl3
