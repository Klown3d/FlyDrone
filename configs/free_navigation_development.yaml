  - {name: free_perturbed, seed: 20910102, crosswind_force_n: 0.65, wind_start_s: 8.0, wind_end_s: 55.0, position_noise_std_m: 0.040, sensor_delay_s: 0.18, heading_noise_std_deg: 6.0, angular_rate_noise_std_deg_s: 3.2, heading_dropout_start_s: 18.0, heading_dropout_end_s: 28.0, velocity_dropout_start_s: 34.0, velocity_dropout_end_s: 43.0, accelerometer_noise_std_m_s2: 0.22}
