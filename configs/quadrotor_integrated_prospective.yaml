base_config: configs/quadrotor_benchmark.yaml
plant_config: configs/quadrotor.yaml
orientation_config: configs/orientation_candidate_v1.yaml
phase_compass_config: configs/phase_compass_cross_compartment_v4.yaml
pfl2_steering_config: configs/pfl2_steering.yaml
pfl2_advance_config: configs/pfl2_advance.yaml
travel_direction_drift_config: configs/travel_direction_drift.yaml
travel_velocity_sensor_config: configs/travel_velocity_sensor.yaml
output: results/simulation/quadrotor_integrated_prospective
manifest_key: quadrotor_integrated_prospective
run_once: true
duration_s: 35.0
target_bearings_deg: [-168.0, -88.0, -8.0, 72.0, 152.0]
initial_relative_headings_deg: [-155.0, -35.0, 105.0]
scenarios:
  - {name: heldout_combined_moderate, seed: 20261220, crosswind_force_n: 0.55, wind_start_s: 3.2, wind_end_s: 14.5, position_noise_std_m: 0.018, sensor_delay_s: 0.10, heading_noise_std_deg: 4.5, angular_rate_noise_std_deg_s: 1.8, heading_dropout_start_s: 6.5, heading_dropout_end_s: 9.0, velocity_dropout_start_s: 10.5, velocity_dropout_end_s: 13.0}
  - {name: heldout_combined_strong, seed: 20261221, crosswind_force_n: 0.80, wind_start_s: 2.8, wind_end_s: 15.5, position_noise_std_m: 0.030, sensor_delay_s: 0.14, heading_noise_std_deg: 5.5, angular_rate_noise_std_deg_s: 2.8, heading_dropout_start_s: 4.5, heading_dropout_end_s: 8.5, velocity_dropout_start_s: 6.5, velocity_dropout_end_s: 10.5}
conditions:
