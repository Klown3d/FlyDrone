  - {name: conventional_navigation, yaw_controller: proportional, heading_mode: gyro_integrated, velocity_source: none, pfl2_enabled: false, advance_enabled: false, hdelta_enabled: false, lateral_velocity_kd_per_s: 2.0}
gate:
  minimum_full_successes: 27
  minimum_successes_each_scenario: 13
  maximum_success_deficit_vs_conventional: 3
  maximum_arrival_time_cost_vs_conventional_s: 8.0
  maximum_cross_track_cost_vs_conventional_m: 0.70
  minimum_success_advantage_over_no_hdelta: 12
  maximum_success_deficit_vs_no_pfl2: 2
  maximum_motor_saturation_fraction: 0.10
parameter_status: prospectively_frozen_after_corrective_development_cycle
