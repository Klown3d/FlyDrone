base_config: configs/quadrotor_integrated_v4_prospective.yaml
output: results/simulation/quadrotor_integrated_v4_ood_failure_oracles
manifest_key: quadrotor_integrated_v4_ood_failure_oracles
protocol_id: diagnostic_ood_failure_oracles_v1
run_once: false
gate: null
parameter_status: diagnostic_oracle_causal_localization_not_controller_validation
claim: Privileged simulator-truth oracles are used only to localize one preserved OOD failure; these flights are not controller-validation results.
duration_s: 45.0
target_distance_m: 6.0
target_bearings_deg: [107.0]
initial_relative_headings_deg: [-137.0]
scenarios:
  # The original pilot enumerated two bearings; this geometry used seed + index = 20400113.
  - {name: ood_long_dropout_failed_geometry, seed: 20400113, crosswind_force_n: 0.95, wind_start_s: 4.0, wind_end_s: 26.0, position_noise_std_m: 0.05, sensor_delay_s: 0.24, heading_noise_std_deg: 7.5, angular_rate_noise_std_deg_s: 4.0, heading_dropout_start_s: 9.0, heading_dropout_end_s: 18.0, velocity_dropout_start_s: 11.0, velocity_dropout_end_s: 20.0, accelerometer_noise_std_m_s2: 0.26}
conditions:
  - {name: observed_failure_replication, circuit_condition: intact, yaw_controller: neural, heading_mode: neural_compass, velocity_source: inertial_fusion, pfl2_enabled: true, advance_enabled: true, hdelta_enabled: true, lateral_velocity_kd_per_s: 0.25, drift_oracle_mode: none}
  - {name: diagnostic_true_heading, circuit_condition: intact, yaw_controller: neural, heading_mode: direct, velocity_source: inertial_fusion, pfl2_enabled: true, advance_enabled: true, hdelta_enabled: true, lateral_velocity_kd_per_s: 0.25, drift_oracle_mode: true_heading}
  - {name: diagnostic_true_velocity, circuit_condition: intact, yaw_controller: neural, heading_mode: neural_compass, velocity_source: inertial_fusion, pfl2_enabled: true, advance_enabled: true, hdelta_enabled: true, lateral_velocity_kd_per_s: 0.25, drift_oracle_mode: true_velocity}
  - {name: diagnostic_true_heading_velocity, circuit_condition: intact, yaw_controller: neural, heading_mode: direct, velocity_source: inertial_fusion, pfl2_enabled: true, advance_enabled: true, hdelta_enabled: true, lateral_velocity_kd_per_s: 0.25, drift_oracle_mode: true_heading_velocity}
save_all_traces: true
