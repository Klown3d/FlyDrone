base_config: configs/quadrotor_benchmark.yaml
protocol_id: flydrone_integrated_v2_prospective_v1
lock_file: configs/quadrotor_integrated_v2_prospective.lock.json
plant_config: configs/quadrotor.yaml
orientation_config: configs/orientation_candidate_v1.yaml
phase_compass_config: configs/phase_compass_cross_compartment_v4.yaml
pfl2_steering_config: configs/pfl2_steering.yaml
pfl2_advance_config: configs/pfl2_advance.yaml
travel_direction_drift_config: configs/travel_direction_drift.yaml
travel_velocity_sensor_config: configs/travel_velocity_sensor.yaml
travel_velocity_inertial_config: configs/travel_velocity_inertial_3d.yaml
output: results/simulation/quadrotor_integrated_v2_prospective
manifest_key: quadrotor_integrated_v2_prospective
run_once: true
duration_s: 35.0
target_bearings_deg: [-151.0, -79.0, 13.0, 97.0, 169.0]
