  velocity_filter_tau_s: 0.40
  entry_radius_m: 0.20
  exit_radius_m: 0.45
  stop_speed_m_s: 0.18
  confirm_s: 0.40
  departure_confirm_s: 0.40
  recovery_enabled: true
  suppress_drift_when_arrived: true
  biological_status: engineering_arrival_interface_not_neural
scenarios:
  - {name: v2_gate_heading_velocity, seed: 20281221, crosswind_force_n: 0.68, wind_start_s: 2.4, wind_end_s: 15.6, position_noise_std_m: 0.034, sensor_delay_s: 0.15, heading_noise_std_deg: 6.2, angular_rate_noise_std_deg_s: 3.1, heading_dropout_start_s: 4.0, heading_dropout_end_s: 10.4, velocity_dropout_start_s: 14.4, velocity_dropout_end_s: 19.0, accelerometer_noise_std_m_s2: 0.19, accelerometer_bias_x_m_s2: -0.045, accelerometer_bias_y_m_s2: 0.052, accelerometer_bias_z_m_s2: 0.065}
  - {name: v2_gate_combined_late, seed: 20281222, crosswind_force_n: 0.84, wind_start_s: 4.2, wind_end_s: 20.5, position_noise_std_m: 0.040, sensor_delay_s: 0.18, heading_noise_std_deg: 6.5, angular_rate_noise_std_deg_s: 3.4, heading_dropout_start_s: 12.5, heading_dropout_end_s: 17.0, velocity_dropout_start_s: 5.0, velocity_dropout_end_s: 12.0, accelerometer_noise_std_m_s2: 0.23, accelerometer_bias_x_m_s2: 0.065, accelerometer_bias_y_m_s2: -0.055, accelerometer_bias_z_m_s2: -0.080}
conditions:
  - {name: full_flywire_v2, circuit_condition: intact, yaw_controller: neural, heading_mode: neural_compass, velocity_source: inertial_fusion, pfl2_enabled: true, advance_enabled: true, hdelta_enabled: true, lateral_velocity_kd_per_s: 0.0}
  - {name: no_pfl2, circuit_condition: intact, yaw_controller: neural, heading_mode: neural_compass, velocity_source: inertial_fusion, pfl2_enabled: false, advance_enabled: false, hdelta_enabled: true, lateral_velocity_kd_per_s: 0.0}
  - {name: no_hdelta, circuit_condition: intact, yaw_controller: neural, heading_mode: neural_compass, velocity_source: none, pfl2_enabled: true, advance_enabled: true, hdelta_enabled: false, lateral_velocity_kd_per_s: 0.0}
  - {name: delta7_ablated, circuit_condition: delta7_ablated, steering_ablation: delta7, yaw_controller: neural, heading_mode: neural_compass, velocity_source: inertial_fusion, pfl2_enabled: true, advance_enabled: true, hdelta_enabled: true, lateral_velocity_kd_per_s: 0.0}
  - {name: direct_velocity_matched, circuit_condition: non_neural_matched, yaw_controller: neural, heading_mode: neural_compass, velocity_source: inertial_fusion, pfl2_enabled: true, advance_enabled: true, hdelta_enabled: true, drift_readout_mode: direct_velocity, lateral_velocity_kd_per_s: 0.0}
  - {name: conventional_navigation, circuit_condition: conventional, yaw_controller: proportional, heading_mode: gyro_integrated, velocity_source: none, pfl2_enabled: false, advance_enabled: false, hdelta_enabled: false, lateral_velocity_kd_per_s: 2.0}
gate:
  minimum_full_successes: 27
  minimum_successes_each_scenario: 13
  minimum_success_advantage_over_no_hdelta: 20
  minimum_success_advantage_over_delta7_ablation: 20
  maximum_success_deficit_vs_direct: 3
  maximum_success_deficit_vs_conventional: 3
  maximum_success_deficit_vs_no_pfl2: 2
  maximum_arrival_time_cost_vs_conventional_s: 8.0
  maximum_cross_track_cost_vs_conventional_m: 0.80
  maximum_motor_saturation_fraction: 0.01
save_all_traces: false
